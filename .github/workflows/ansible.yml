---
name: Bitcoin
on:
  pull_request:
  push:
    branches:
      - main

jobs:

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Lint
        run: make lint

  molecule:
    runs-on: ubuntu-latest
    strategy:
      max-parallel: 4
      matrix:
        include:
          # Ubuntu 20.04 dropped: end of standard support was April 2025.
          - distro: debian12
            impl: core
            version: "31.1"
          - distro: debian13
            impl: core
            version: "31.1"
          - distro: ubuntu2204
            impl: core
            version: "31.1"
          - distro: ubuntu2404
            impl: core
            version: "31.1"
          - distro: debian13
            impl: knots
            version: "29.3.knots20260508"
          - distro: ubuntu2404
            impl: knots
            version: "29.3.knots20260508"
    steps:
      - uses: actions/checkout@v4

      - name: Test with molecule
        run: make test DISTRO=${{ matrix.distro }} BITCOIND_IMPL=${{ matrix.impl }} BITCOIND_VERSION=${{ matrix.version }}
        env:
          PY_COLORS: '1'
          ANSIBLE_FORCE_COLOR: '1'

  # Exercises the version cookie logic that decides whether to swap binaries.
  # A fresh-install test never reaches it.
  upgrade:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - distro: debian12
            impl: core
            from: "31.0"
            to: "31.1"
    steps:
      - uses: actions/checkout@v4

      - name: Test the upgrade path with molecule
        run: >-
          make test SCENARIO=upgrade
          DISTRO=${{ matrix.distro }}
          BITCOIND_IMPL=${{ matrix.impl }}
          BITCOIND_VERSION_FROM=${{ matrix.from }}
          BITCOIND_VERSION_TO=${{ matrix.to }}
        env:
          PY_COLORS: '1'
          ANSIBLE_FORCE_COLOR: '1'
