---
name: Bitcoin
on:
  pull_request:
  push:
    branches:
      - main

jobs:

  molecule:
    runs-on: ubuntu-latest
    strategy:
      max-parallel: 4
      matrix:
        include:
          # Ubuntu 20.04 dropped: end of standard support was April 2025.
          - distro: debian12
            impl: core
            version: "31.1"
          - distro: debian13
            impl: core
            version: "31.1"
          - distro: ubuntu2204
            impl: core
            version: "31.1"
          - distro: ubuntu2404
            impl: core
            version: "31.1"
          - distro: debian13
            impl: knots
            version: "29.3.knots20260508"
          - distro: ubuntu2404
            impl: knots
            version: "29.3.knots20260508"
    steps:
      - uses: actions/checkout@v4

      - name: Test with molecule
        run: make test DISTRO=${{ matrix.distro }} BITCOIND_IMPL=${{ matrix.impl }} BITCOIND_VERSION=${{ matrix.version }}
        env:
          PY_COLORS: '1'
          ANSIBLE_FORCE_COLOR: '1'
