---
- name: Converge
  hosts: all
  become: true

  vars:
    bitcoind_network: regtest
    bitcoind_use_onion: true
    bitcoind_rpc_auth: "test:a]3a49e54de0048a4bae6de3f3e85c6$6f4c35e75cde9ee37694dcf40a932ea90c05e3a5efd16a6e0c9ae3e0abd1e9b2"
    # Exercise the passthrough: options the role does not name explicitly, plus
    # an override of a named variable (bitcoind_txindex is true by default).
    bitcoind_config:
      dbcache: 512
      maxconnections: 40
      uacomment: molecule
      txindex: false
    bitcoind_implementation: "{{ lookup('env', 'BITCOIND_IMPL') | default('core', true) }}"
    bitcoind_version: "{{ lookup('env', 'BITCOIND_VERSION') | default('31.1', true) }}"
  roles:
    - mvrahden.bitcoind
