---
dependency:
  name: galaxy

driver:
  name: docker

platforms:
  - name: instance-upgrade
    image: geerlingguy/docker-${MOLECULE_DISTRO:-debian12}-ansible:latest
    command: ${MOLECULE_DOCKER_COMMAND:-""}
    volumes:
      - /sys/fs/cgroup:/sys/fs/cgroup:rw
    cgroupns_mode: host
    privileged: true
    pre_build_image: true

provisioner:
  name: ansible
  env:
    ANSIBLE_VERBOSITY: 1
    BITCOIND_IMPL: ${BITCOIND_IMPL:-core}
    BITCOIND_VERSION_FROM: ${BITCOIND_VERSION_FROM:-""}
    BITCOIND_VERSION_TO: ${BITCOIND_VERSION_TO:-""}

# The default test sequence already runs side_effect between converge and
# verify, which is exactly the shape this scenario needs: converge installs
# BITCOIND_VERSION_FROM, side_effect upgrades to BITCOIND_VERSION_TO, and
# verify asserts the swap actually happened. Idempotence runs against the
# first install, before the upgrade.
verifier:
  name: ansible
